# =============================================================================
# AWS Amplify Build Spec — ChessLearn Frontend
# =============================================================================
# Reference file: Use this if you ever want to deploy ONLY the Next.js frontend
# on AWS Amplify (like LibrosMx), with the backend running elsewhere.
#
# Required Amplify environment variables:
#   NEXT_PUBLIC_API_URL  — e.g., https://api.chess.yourdomain.com
#   NEXT_PUBLIC_WS_URL   — e.g., wss://api.chess.yourdomain.com/ws
# =============================================================================
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - echo "Validating environment variables..."
        - test -n "$NEXT_PUBLIC_API_URL" || (echo "ERROR: Missing NEXT_PUBLIC_API_URL" && exit 1)
        - test -n "$NEXT_PUBLIC_WS_URL" || (echo "ERROR: Missing NEXT_PUBLIC_WS_URL" && exit 1)
        - echo "Environment validation passed"
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
